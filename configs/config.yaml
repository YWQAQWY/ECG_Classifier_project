# ============================================================
# DANN + Transformer 跨被试 EEG 情绪识别 - 配置文件
# 架构: 共享Transformer F + 三个并列分支 (C / GRL+D / Con)
# ============================================================

# 数据配置
data:
  train_root: "./赛题四数据集及说明文档/训练集"
  test_root: "./赛题四数据集及说明文档/公开测试集"

  sampling_rate: 250
  n_channels: 30

  # 训练集 trial 切分
  train_trial_length: 12500
  test_trial_length: 2500

  # 滑动窗口参数
  window_size: 250
  stride: 125

  # DE 特征频段定义 (Hz)
  frequency_bands:
    theta: [4, 8]
    alpha: [8, 14]
    beta: [14, 31]
    gamma: [31, 45]

  # 降采样
  downsample:
    enabled: true                # 是否启用降采样
    ratio: 0.5                   # 每个被试保留比例 (1.0=不降采样)

  # 训练/测试时长匹配 (P0优化)
  match_test_duration: true      # 训练trial切为10s短段, 匹配测试集条件
  test_segment_length: 2500      # 测试集每段10秒=2500采样点

  # 归一化: z-score (每个被试独立)
  normalization: "zscore"

  # 交叉验证折数 (5=5折CV, 0=留一法LOSO)
  n_folds: 5

# Transformer 编码器配置
transformer:
  # 输入: 30 tokens (channels) × 4 dims (bands)
  token_dim: 4                  # 每个 token 的维度 (4个频段的DE)
  n_tokens: 30                  # token 数量 (30通道)
  d_model: 64                   # Transformer 隐层维度
  n_heads: 4                    # 多头注意力头数
  n_layers: 3                   # Transformer 层数
  dim_feedforward: 256           # FFN 隐层维度
  dropout: 0.1                   # Transformer dropout
  # 输出: z (batch, d_model=64)

# 分支 C: 情绪分类器
classifier:
  hidden_dims: [64, 32]         # z(64) → 64 → 32 → 2
  n_classes: 2
  dropout: 0.3

# 分支 D: 域判别器 (GRL + D)
domain_discriminator:
  hidden_dims: [64, 32]         # GRL(z) → 64 → 32 → 2
  n_domains: 2                  # source=0, target=1
  dropout: 0.3
  grl_lambda: 1.0               # GRL 梯度反转系数

# 分支 Con: 对比学习
contrastive:
  temperature: 0.1              # 对比学习温度
  # 使用内积相似度: s = z_i^T z_j (L2 normalized)

# 集成伪标签 - 扩充源域 (预处理阶段, CV之前一次性完成)
ensemble:
  enabled: true                 # 是否用集成伪标签扩充源域
  confidence_threshold: 0.8     # 全票通过阈值

# 训练配置
training:
  optimizer: "adam"
  learning_rate: 0.0005
  weight_decay: 0.0001

  epochs: 100
  stage1_epochs: 100            # Stage 1 (抑郁症分类) 训练轮数
  batch_size: 512

  # 学习率调度
  lr_scheduler: "step"
  lr_step_size: 10
  lr_gamma: 0.99

  device: "cuda"

# Stage 1 特定配置 (抑郁症分类)
stage1:
  epochs: 100                    # 训练轮数 (与Stage2相同)
  class_weight: [1.0, 2.0]       # [healthy, depressed] CE 权重 (缓解40:20不平衡)
  domain_weight: 0.3             # 域对抗权重 (强化健康/抑郁域对齐, Stage2用0.1)

# 损失权重
loss_weights:
  cls: 1.0                      # 分类损失权重
  domain: 0.1                   # 域对抗损失权重
  contrastive: 0.05             # 对比学习损失权重

# 实验配置
experiment:
  name: "dann_transformer_eeg"
  seed: 42

  save_dir: "./checkpoints"
  log_dir: "./logs"
  log_interval: 10
  eval_interval: 1
